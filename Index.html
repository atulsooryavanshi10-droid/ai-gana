<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gana</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      display: none;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .download {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 AI Gana</h1>
  <p>तुमचे Lyrics → तुमचे AI गाणे</p>
</header>

<div class="container">
  <div class="card">

    <label>भाषा / Language</label>
    <select id="language">
      <option>Auto Detect</option>
      <option>Marathi</option>
      <option>Hindi</option>
      <option>English</option>
      <option>Gujarati</option>
      <option>Tamil</option>
      <option>Telugu</option>
      <option>Kannada</option>
      <option>Malayalam</option>
      <option>Punjabi</option>
      <option>Bengali</option>
    </select>

    <label>Lyrics</label>
    <textarea
      id="lyrics"
      placeholder="तुमच्या गाण्याचे lyrics येथे लिहा..."
    ></textarea>

    <label>Music Prompt</label>
    <textarea
      id="musicPrompt"
      placeholder="उदा. Energetic Marathi DJ song with powerful drums..."
    ></textarea>

    <label>Voice</label>
    <select id="voice">
      <option>Male</option>
      <option>Female</option>
      <option>Duet</option>
    </select>

    <label>Mood</label>
    <select id="mood">
      <option>Energetic</option>
      <option>Romantic</option>
      <option>Devotional</option>
      <option>Sad</option>
      <option>Motivational</option>
      <option>Party</option>
      <option>Calm</option>
    </select>

    <label>Music Style</label>
    <select id="musicStyle">
      <option>DJ / Dance</option>
      <option>Bollywood</option>
      <option>Indian Folk</option>
      <option>Classical</option>
      <option>Rap / Hip-Hop</option>
      <option>Rock</option>
      <option>Lo-fi</option>
      <option>Devotional</option>
    </select>

    <button id="generateBtn" onclick="generateSong()">
      🎵 Generate Song
    </button>

    <div class="result" id="result"></div>

    <audio id="audioPlayer" controls style="display:none;"></audio>

    <a id="downloadBtn" class="download" download="ai-gana.mp3">
      ⬇️ Download MP3
    </a>

  </div>
</div>

<script>

async function generateSong() {

  const lyrics = document.getElementById("lyrics").value.trim();
  const language = document.getElementById("language").value;
  const musicPrompt = document.getElementById("musicPrompt").value.trim();
  const voice = document.getElementById("voice").value;
  const mood = document.getElementById("mood").value;
  const musicStyle = document.getElementById("musicStyle").value;

  const result = document.getElementById("result");
  const button = document.getElementById("generateBtn");
  const audioPlayer = document.getElementById("audioPlayer");
  const downloadBtn = document.getElementById("downloadBtn");

  if (!lyrics) {
    result.style.display = "block";
    result.innerHTML = "⚠️ आधी Lyrics लिहा.";
    return;
  }

  button.disabled = true;
  button.innerHTML = "⏳ गाणे तयार होत आहे...";

  result.style.display = "block";
  result.innerHTML = "🎵 AI तुमचे गाणे तयार करत आहे...<br><br>थोडा वेळ लागू शकतो.";

  audioPlayer.style.display = "none";
  downloadBtn.style.display = "none";

  try {

    const response = await fetch("/api/generate-song", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        lyrics: lyrics,
        language: language,
        musicPrompt: musicPrompt,
        voice: voice,
        mood: mood,
        musicStyle: musicStyle
      })
    });

    if (!response.ok) {

      let errorMessage = "Song generation failed.";

      try {
        const errorData = await response.json();

        errorMessage =
          errorData.error ||
          errorData.message ||
          errorMessage;

      } catch (e) {
        errorMessage = await response.text();
      }

      throw new Error(errorMessage);
    }

    const audioBlob = await response.blob();

    const audioURL = URL.createObjectURL(audioBlob);

    audioPlayer.src = audioURL;
    audioPlayer.style.display = "block";

    downloadBtn.href = audioURL;
    downloadBtn.download = "ai-gana.mp3";
    downloadBtn.style.display = "block";

    result.innerHTML =
      "✅ तुमचे AI गाणे तयार झाले! 🎉<br><br>खाली Play करा किंवा MP3 Download करा.";

  } catch (error) {

    console.error(error);

    result.style.display = "block";

    result.innerHTML =
      "❌ गाणे तयार करताना समस्या आली.<br><br>" +
      "<small>" + error.message + "</small>";
  }

  button.disabled = false;
  button.innerHTML = "🎵 Generate Song";
}

</script>

</body>
</html>
