<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 AI Gana</h1>
  <p>तुमचे Lyrics → तुमचे AI गाणे</p>
</header>

<div class="container">
  <div class="card">

    <label>भाषा / Language</label>
    <select>
      <option>Auto Detect</option>
      <option>Marathi</option>
      <option>Hindi</option>
      <option>English</option>
      <option>Gujarati</option>
      <option>Tamil</option>
      <option>Telugu</option>
      <option>Kannada</option>
      <option>Malayalam</option>
      <option>Punjabi</option>
      <option>Bengali</option>
    </select>

    <label>Lyrics</label>
    <textarea placeholder="तुमच्या गाण्याचे lyrics येथे लिहा..."></textarea>

    <label>Music Prompt</label>
    <textarea placeholder="उदा. Energetic Marathi DJ song with powerful drums..."></textarea>

    <label>Voice</label>
    <select>
      <option>Male</option>
      <option>Female</option>
      <option>Duet</option>
    </select>

    <label>Mood</label>
    <select>
      <option>Energetic</option>
      <option>Romantic</option>
      <option>Devotional</option>
      <option>Sad</option>
      <option>Motivational</option>
      <option>Party</option>
      <option>Calm</option>
    </select>

    <label>Music Style</label>
    <select>
      <option>DJ / Dance</option>
      <option>Bollywood</option>
      <option>Indian Folk</option>
      <option>Classical</option>
      <option>Rap / Hip-Hop</option>
      <option>Rock</option>
      <option>Lo-fi</option>
      <option>Devotional</option>
    </select>

    <button onclick="generateSong()">🎵 Generate Song</button>

    <div class="result" id="result">
      🎶 Song generation will appear here.
    </div>

  </div>
</div>

<script>
function generateSong() {
  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML =
    "⏳ Song generation system तयार होत आहे...";
}
</script>

</body>
  </html>
